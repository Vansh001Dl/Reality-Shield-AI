version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: realityshield-backend
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/realityshield}
      - SECRET_KEY=${SECRET_KEY:-development_secret_key_change_this}
      - API_KEY=${API_KEY:-dev_api_key}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-realityshield-videos}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RATE_LIMIT=${RATE_LIMIT:-1000}
    depends_on:
      - postgres
    volumes:
      - ./backend/ml_models:/app/ml_models
      - ./uploads:/app/uploads:cached

  frontend:
    build:
      context: ./frontend
    container_name: realityshield-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
      - VITE_API_KEY=${API_KEY:-dev_api_key}
    depends_on:
      - backend
    volumes:
      - /app/node_modules

  postgres:
    image: postgis/postgis:15-3.4
    container_name: realityshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realityshield}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  # Optional: Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: realityshield-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: realityshield-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data: